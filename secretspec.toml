[project]
name = "semantic-release-ai-notes"
revision = "1.0"

[providers]
app-secrets = "onepassword://my.1password.com@App%20Secrets"

[defaults]
providers = ["app-secrets"]

# The release workflow's ANTHROPIC_API_KEY secret
[profiles.production]
ANTHROPIC_API_KEY = { description = "Writes release notes in the release workflow", ref = { item = "semantic-release-ai-notes anthropic api key", field = "password" } }

[tool.keypin]
ignore = ["NPM_TOKEN"]

[tool.keypin.production.ANTHROPIC_API_KEY]
rotate_every = "180d"
publish = [{ to = "github-actions", repo = "caiopizzol/semantic-release-ai-notes" }]
