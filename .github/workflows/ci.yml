name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned so the dist freshness check below compares bundles from the
          # same bundler version that produced the committed artifact.
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ./node_modules/.bin/biome check .
      - run: ./node_modules/.bin/tsc --noEmit
      - run: bun test
      - name: Build action and verify committed artifact is fresh
        run: |
          bun build action/index.ts --outfile dist/action/index.mjs --target node
          git diff --exit-code dist/action/index.mjs || {
            echo "::error::dist/action/index.mjs is stale — run 'pnpm build:action' and commit the result."
            exit 1
          }
