# This project's keys for keypin (https://github.com/caiopizzol/keypin). Names and places, never values.
# `bunx keypin@0.10.0 publish ANTHROPIC_API_KEY` writes the release workflow's ANTHROPIC_API_KEY secret.
[1password]
account = "my.1password.com"

[keys.ANTHROPIC_API_KEY]
rotate_every = "180d"

[keys.ANTHROPIC_API_KEY.prod]
from = "op://App Secrets/semantic-release-ai-notes anthropic api key/password"

[[keys.ANTHROPIC_API_KEY.prod.publish]]
to = "github-actions"
repo = "caiopizzol/semantic-release-ai-notes"
